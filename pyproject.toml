[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "darbrrb"
version = "1.0.0"
description = "dar-based blu-ray redundant backup"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["darbrrb.py"]
python_classes = ["Test*"]
python_functions = ["test*"]
addopts = "-v --cov=darbrrb --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
